server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # SPA fallback + cache static assets
  location / {
    try_files $uri $uri/ /index.html;
  }
  # NOTE (akm 3rd-tab embedding): the benchmark-api backend is not bundled
  # here, so the same-origin /api/benchmark + /health proxies from upstream
  # are intentionally omitted — nginx refuses to start when a proxy_pass host
  # cannot be resolved. The dashboard works fully offline from its committed
  # static JSON; only live Benchmark run/rerun mutations need the backend.
  # Answer the backend path with JSON 503 (not the SPA fallback) so the
  # Benchmark tab's 4s status poll degrades cleanly to static reports.
  location /api/benchmark/ {
    access_log off;
    add_header Content-Type application/json;
    return 503 '{"detail":"benchmark backend not bundled in this deployment"}';
  }
  location /health {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
