services:
  mapper:
    build: .
    container_name: agentic-knowledge-mapper
    ports:
      - "8204:8204"
    environment:
      # LLM inference routes to the fox-services node on the GPU server
      # (axiom-1, 2x RTX 5080) at :8210; no fallback is configured, so a
      # down gateway fails fast instead of silently hopping to a peer.
      # Direct web fetches go through the local broker's OpenShell sandbox.
      - LLM_BASE_URL=${LLM_BASE_URL:-http://192.168.1.173:8210/v1}
      - LLM_FALLBACK_URL=${LLM_FALLBACK_URL:-}
      - LLM_MODEL=${LLM_MODEL:-qwen3.8:27b}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-qwen3.8:27b}
      - LLM_TIMEOUT_S=${LLM_TIMEOUT_S:-180}
      # OpenShell protection: agent tool fetches run inside a managed sandbox
      # via the fox-services broker; unreachable broker/gateway degrades to
      # direct fetch and the assessment records which path served each page.
      - OPENSHELL_ENABLED=${OPENSHELL_ENABLED:-1}
      - OPENSHELL_BROKER_URL=${OPENSHELL_BROKER_URL:-http://host.docker.internal:8210}
      - OPENSHELL_TIMEOUT_S=${OPENSHELL_TIMEOUT_S:-25}
    volumes:
      - akm_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 3rd tab ("AI Standards & Regulations"): static build of
  # harishgovardhandamodar/AI-standards-regulations-dashboard (vendored under
  # ./standards-dashboard, nginx.conf adjusted for backend-less mode).
  # Served on :5173 and embedded in the :8204 UI via iframe.
  standards:
    build: ./standards-dashboard
    container_name: ai-standards-dashboard
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  akm_data:
