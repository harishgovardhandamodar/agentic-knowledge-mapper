let activeExpId = null, pollExpTimer = null, activeArticle = null;

function escHtml(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function mdInline(s) {
  s = escHtml(s);
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:var(--accent);">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|\W)\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/`([^`]+)`/g, '<code style="background:var(--bg3);padding:1px 5px;border-radius:4px;font-size:11px;">$1</code>');
  return s;
}
function mdBlock(text) {
  const lines = (text || '').split('\n');
  let html = '', list = null;
  const close = () => { if (list) { html += list === 'ul' ? '</ul>' : '</ol>'; list = null; } };
  for (const ln of lines) {
    const t = ln.trim();
    let m;
    if (m = t.match(/^###\s+(.*)/)) { close(); html += `<h4>${mdInline(m[1])}</h4>`; }
    else if (m = t.match(/^##\s+(.*)/)) { close(); html += `<h3>${mdInline(m[1])}</h3>`; }
    else if (m = t.match(/^[-*]\s+(.*)/)) { if (list !== 'ul') { close(); html += '<ul>'; list = 'ul'; } html += `<li>${mdInline(m[1])}</li>`; }
    else if (m = t.match(/^\d+[.)]\s+(.*)/)) { if (list !== 'ol') { close(); html += '<ol>'; list = 'ol'; } html += `<li>${mdInline(m[1])}</li>`; }
    else if (!t) close();
    else { close(); html += `<p>${mdInline(t)}</p>`; }
  }
  close();
  return html;
}

async function askExplainer() {
  if (!currentInv) { showNotif('Select an investigation first', 'error'); return; }
  const q = document.getElementById('askInput').value.trim();
  if (!q) return;
  const res = await fetch(`${API}/investigations/${currentInv}/explain`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      question: q,
      mode: document.getElementById('modeSel').value,
      depth: document.getElementById('depthSel').value,
      audience: document.getElementById('audSel').value,
    }),
  });
  if (res.status === 429) { showNotif('An explanation is already running', 'error'); return; }
  if (!res.ok) { showNotif('Failed to start explainer', 'error'); return; }
  const exp = await res.json();
  document.getElementById('askInput').value = '';
  watchExplanation(exp.id);
  loadExplanations();
}

function saveExplDefaults() {
  localStorage.setItem('explMode', document.getElementById('modeSel').value);
  localStorage.setItem('explDepth', document.getElementById('depthSel').value);
  localStorage.setItem('explAud', document.getElementById('audSel').value);
}

function loadExplDefaults() {
  const lst = localStorage;
  if (lst.explMode) document.getElementById('modeSel').value = lst.explMode;
  if (lst.explDepth) document.getElementById('depthSel').value = lst.explDepth;
  if (lst.explAud) document.getElementById('audSel').value = lst.explAud;
}

function watchExplanation(id) {
  if (pollExpTimer) clearInterval(pollExpTimer);
  activeExpId = id;
  pollExpTimer = setInterval(pollExplanation, 3000);
  pollExplanation();
}

function stopExpPoll() {
  if (pollExpTimer) clearInterval(pollExpTimer);
  pollExpTimer = null;
}

async function pollExplanation() {
  if (!activeExpId) return;
  try {
    const res = await fetch(`${API}/explanations/${activeExpId}`);
    const exp = await res.json();
    if (exp.status === 'done' || exp.status === 'error') {
      stopExpPoll();
      renderExplanation(exp);
      loadExplanations();
    } else {
      document.getElementById('askStatus').innerHTML =
        `<i class="fas fa-spinner spin"></i> Researching & writing… (${escHtml(exp.question.substring(0, 80))})`;
      renderExplanationShell(exp);
    }
  } catch (e) {}
}

function renderExplanationShell(exp) {
  document.getElementById('articleBox').innerHTML = `
    <div class="article"><h2>${escHtml(exp.question)}</h2>
    <div style="color:var(--text2);font-size:12px;"><i class="fas fa-spinner spin"></i> Searching the web, reading sources, composing…</div></div>`;
}

function renderExplanation(exp) {
  stopExpPoll();
  activeExpId = exp.id;
  activeArticle = exp;
  const box = document.getElementById('articleBox');
  document.getElementById('askStatus').textContent =
    exp.status === 'done' ? '' : `Failed: ${(exp.error || '').split('\n')[0]}`;
  if (exp.status !== 'done' || !exp.answer) {
    if (exp.status !== 'error') box.innerHTML = '';
    else box.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><br/>Explanation failed</div>`;
    return;
  }
  const a = exp.answer;
  let html = `<div class="article">
<div style="display:flex;justify-content:space-between;align-items:start;gap:12px;">
        <h2 style="flex:1;">${escHtml(exp.question)}</h2>
        <div style="display:flex;gap:6px;flex-shrink:0;">
          <button class="btn btn-ghost btn-sm ${exp.bookmarked ? 'bkmk-on' : ''}" onclick="toggleBookmark(${exp.id}, this)" title="${exp.bookmarked ? 'Remove bookmark' : 'Bookmark this answer'}"><i class="fas fa-bookmark"></i></button>
          <button class="btn btn-ghost btn-sm" ${exp.status === 'done' ? '' : 'disabled'} onclick="makeQuiz(${exp.id})" title="Turn this answer into a review quiz"><i class="fas fa-clipboard-question"></i> Quiz</button>
          <button class="btn btn-ghost btn-sm" onclick="toggleTrace()" title="Show how the agent searched, read and chose sources"><i class="fas fa-magnifying-glass-chart"></i> Research trace</button>
          <button class="btn btn-ghost btn-sm" onclick="saveExplanationToGraph(${exp.id})" title="Save as structured knowledge (concepts + relations) in this investigation"><i class="fas fa-share-nodes"></i> Save to graph</button>
          <button class="btn btn-ghost btn-sm" onclick="investigateGaps(${exp.id})" title="Auto-investigate open questions as an agent run"><i class="fas fa-compass-drafting"></i> Investigate gaps</button>
          <button class="btn btn-danger btn-sm" onclick="deleteExplanation(${exp.id})"><i class="fas fa-trash"></i></button>
        </div>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:8px;">
        <span class="mode-pill">${escHtml(exp.mode || 'explain')}</span>
        <span class="mode-pill">${escHtml(exp.depth || 'balanced')}</span>
        <span class="mode-pill">${escHtml(exp.audience || 'intermediate')}</span>
      </div>
      <div id="traceBox" style="display:none;"></div>
    <p style="color:var(--text2);font-style:italic;">${mdInline(a.summary || '')}</p>`;
  if (a.diagram && a.diagram.mermaid) {
    html += `<div class="diagram-wrap">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <strong style="font-size:12px;">${escHtml(a.diagram.title || 'Diagram')}</strong>
        <button class="btn btn-ghost btn-sm" onclick="copyMermaid(this)" title="Copy Mermaid source"><i class="fas fa-copy"></i> Mermaid</button>
      </div>
      <div class="mermaid" data-src="${escHtml(a.diagram.mermaid)}">${escHtml(a.diagram.mermaid)}</div>
      ${a.diagram.caption ? `<div style="font-size:11px;color:var(--text2);margin-top:4px;">${escHtml(a.diagram.caption)}</div>` : ''}
    </div>`;
  }
  (a.sections || []).forEach((s, si) => {
    html += `<div style="display:flex;align-items:baseline;gap:8px;"><h3 style="flex:1;">${escHtml(s.heading || '')}</h3>
      <button class="btn btn-ghost btn-sm" onclick="setFuScope(${exp.id}, ${si})" title="Ask a follow-up about this section"><i class="fas fa-reply"></i> Follow-up</button></div>${mdBlock(s.body || '')}`;
    if (s.claims && s.claims.length) {
      html += `<div class="claims-list">` + s.claims.map((c, ci) => {
        cacheEv(`ev-${si}-${ci}`, c, a);
        return `<div class="claim-row"><div class="claim-text">${mdInline(c.text)}</div><div class="claim-cits">
        ${(c.citations || []).map((cit, ki) => `<button class="ev-btn" onclick="toggleEvidence('${si}', ${ci})" title="Show evidence">[${cit.sourceIndex + 1}]</button>`).join('')}
        <a class="ev-q no-und" href="javascript:void(0)" onclick="toggleEvidence('${si}', ${ci})">Show evidence</a></div>
        <div class="ev-drawer" id="ev-${si}-${ci}" style="display:none;"></div></div>`;
      }).join('') + `</div>`;
    }
    if (s.image) {
      let host = '';
      try { host = new URL(s.image).hostname; } catch (e) {}
      html += `<figure><img src="${escHtml(s.image)}" loading="lazy" alt="${escHtml(s.heading || 'illustration')}" onerror="this.closest('figure').remove()" /><figcaption>Illustration · ${escHtml(host)}</figcaption></figure>`;
    }
  });
  if (a.comparison && a.comparison.length) {
    html += `<h4 style="font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text2);margin:12px 0 6px;">Comparison</h4><div class="tbl-scroll"><table class="cmp-tbl"><thead><tr><th>Aspect</th><th>Option</th><th>Notes</th></tr></thead><tbody>` +
      a.comparison.map(row => `<tr>${(row || []).map((c, j) => j === 0 ? `<th>${mdInline(c)}</th>` : `<td>${mdInline(c)}</td>`).join('')}</tr>`).join('') +
      `</tbody></table></div>`;
  }
  if (a.tradeoffs && a.tradeoffs.length) {
    html += `<div style="margin:10px 0;"><strong><i class="fas fa-scale-balanced"></i> Tradeoffs</strong><ul style="margin:6px 0 0 18px;">${a.tradeoffs.map(r => `<li>${escHtml(Array.isArray(r) ? r.join(' — ') : r)}</li>`).join('')}</ul></div>`;
  }
  if (a.recommendation) html += `<div style="margin:10px 0;"><strong>Recommendation:</strong> ${mdInline(a.recommendation)}</div>`;
  if (a.risk_level) html += `<div style="margin:10px 0;"><strong>Risk level:</strong> <span style="color:${a.risk_level === 'high' ? 'var(--red)' : a.risk_level === 'medium' ? 'var(--orange)' : 'var(--green)'};">${escHtml(a.risk_level)}</span></div>`;
  if (a.critiques && a.critiques.length) {
    html += `<h4 style="font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text2);margin:12px 0 6px;">Critiques</h4>` +
      a.critiques.map(c => `<div class="crit-row"><b>${escHtml(c.claim || 'Claim')}</b><br/><span style="font-size:12px;">Support: ${mdInline(c.support || '')}</span><br/><span style="font-size:12px;color:var(--orange);">Weakness: ${mdInline(c.weakness || '')}</span><br/><span style="font-size:11px;color:var(--text2);">Verdict: ${escHtml(c.verdict || '')}</span></div>`).join('');
  }
  if (a.mechanism_steps && a.mechanism_steps.length) {
    html += `<div style="margin:10px 0;"><strong><i class="fas fa-list-ol"></i> Mechanism</strong><ol style="margin:6px 0 0 20px;">${a.mechanism_steps.map(s => `<li>${mdInline(s)}</li>`).join('')}</ol></div>`;
  }
  if (a.terms && a.terms.length) {
    html += `<h4 style="font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text2);margin:12px 0 6px;">Terms</h4>` +
      a.terms.map(t => `<div class="src-row"><b>${escHtml(t.term)}</b> — ${escHtml(t.definition || '')} ${escHtml((t.citations || []).join(', '))}</div>`).join('');
  }
  if (a.endpoints && a.endpoints.length) {
    html += `<h4 style="font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text2);margin:12px 0 6px;">Endpoints</h4><div class="tbl-scroll"><table class="cmp-tbl"><thead><tr><th>Method</th><th>Path</th><th>Purpose</th></tr></thead><tbody>` +
      a.endpoints.map(e => `<tr><td><code>${escHtml(e.method || '')}</code></td><td><code>${escHtml(e.path || '')}</code></td><td>${escHtml(e.purpose || '')}</td></tr>`).join('') +
      `</tbody></table></div>`;
  }
  if (a.practice) html += `<div style="margin:10px 0;background:var(--bg3);border-radius:6px;padding:10px 12px;"><b><i class="fas fa-pen-nib"></i> Practice</b><br/>${mdInline(a.practice)}</div>`;
  if (a.key_points && a.key_points.length) {
    html += `<div class="kp-box"><strong><i class="fas fa-key"></i> Key points</strong><ul style="margin:6px 0 0 18px;">${a.key_points.map(k => `<li>${mdInline(k)}</li>`).join('')}</ul></div>`;
  }
  if (a.sources && a.sources.length) {
    html += `<h4 style="font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text2);margin:12px 0 6px;">Sources</h4>` +
      a.sources.map((s, i) => `<div class="src-row">[${i + 1}] ${srcLink(s)}</div>`).join('');
  }
  html += `<div class="fu-row">
      <input id="fuInput" placeholder="Ask a follow-up (${fuScopeLabel()})…" onkeydown="if(event.key==='Enter')submitFollowup(${exp.id})" />
      <button class="btn btn-ghost btn-sm" onclick="submitFollowup(${exp.id})"><i class="fas fa-reply"></i> Ask</button>
      <button class="btn btn-ghost btn-sm" onclick="fuScope=null;fuIdx=null;refreshFuPlaceholder(document.getElementById('fuInput'))" title="Reset to whole-explanation scope">Reset scope</button>
    </div>
    <div class="sugg-strip" id="suggStrip" style="display:none;"></div>
    <div id="threadBox"></div>`;
  html += `</div>`;
  box.innerHTML = html;
  renderTrace(exp);
  renderMermaidBlocks();
  renderThread(exp);
  renderQuiz(exp);
  renderSuggestions(exp);
}

function renderMermaidBlocks() {
  const el = document.querySelector('#articleBox .mermaid');
  if (!el) return;
  const scr = document.getElementById('mermaid-lib');
  const run = () => {
    try {
      window.mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'strict' });
      document.querySelectorAll('#articleBox pre.mermaid, #articleBox .mermaid')
        .forEach(node => window.mermaid.run({ nodes: [node] }));
    } catch (e) { console.warn('mermaid render failed', e); }
  };
  if (window.mermaid) { run(); return; }
  if (scr) { scr.onload = run; return; }
  const s = document.createElement('script');
  s.id = 'mermaid-lib';
  s.src = 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload = run;
  document.head.appendChild(s);
}

function copyMermaid(btn) {
  const wrap = btn.closest('.diagram-wrap');
  const code = wrap ? wrap.querySelector('.mermaid').getAttribute('data-src') : '';
  if (!code) return;
  navigator.clipboard.writeText(code).then(() => {
    btn.innerHTML = '<i class="fas fa-check"></i> Copied';
    setTimeout(() => { btn.innerHTML = '<i class="fas fa-copy"></i> Mermaid'; }, 1500);
  });
}

function srcLink(s) {
  if (s.url && s.url.startsWith('graph://')) {
    const id = s.url.split('/').pop();
    return `<span style="color:var(--teal);" title="Internal knowledge-graph source"><i class="fas fa-diagram-project"></i> ${escHtml(s.title || 'graph artifact #' + id)}</span>`;
  }
  return `<a href="${escHtml(s.url)}" target="_blank" rel="noopener">${escHtml(s.title || s.url)}</a>`;
}

let evCache = {};
function cacheEv(id, claim, ans) { evCache[id] = { claim, sources: ans.sources || [] }; }

function toggleEvidence(si, ci, pf) {
  const key = (pf || '') + `ev-${si}-${ci}`;
  const el = document.getElementById(key);
  if (!el) return;
  if (el.style.display === 'none') {
    const meta = evCache[key];
    if (!meta) return;
    let html = `<div style="font-size:11px;">`;
    (meta.claim.citations || []).forEach((cit) => {
      const src = (meta.sources[cit.sourceIndex] || {});
      html += `<div class="ev-block">
        <div class="ev-quote"><i class="fas fa-quote-left" style="color:var(--accent);"></i> ${escHtml(cit.quote || '')}</div>
        <div class="ev-src">— ${srcLink(src)}${src.url && src.url.startsWith('http') ? ` · <a href="${escHtml(src.url)}" target="_blank" rel="noopener">Open source ↗</a>` : ''}</div>
      </div>`;
    });
    html += `</div>`;
    el.innerHTML = html;
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
    el.innerHTML = '';
  }
}

function toggleTrace() {
  const box = document.getElementById('traceBox');
  if (!box) return;
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

function traceHtml(exp) {
  const t = exp.trace || {};
  const qs = t.queries || [];
  const hits = t.hits || [];
  const fetched = t.fetched || [];
  const timings = t.timings_ms || {};
  const lines = [];
  lines.push(`<div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:10px 0 4px;font-size:11px;">
    <div style="font-weight:600;margin-bottom:4px;">Research trace</div>`);
  if (t.graph_context_used) {
    lines.push(`<div style="color:var(--teal);"><i class="fas fa-diagram-project"></i> Used existing knowledge graph</div>
      ${(t.graph_artifacts || []).map(a => `<span style="color:var(--text2);">· ${escHtml(a)}</span>`).join(' ')}`);
  }
  if (t.web_skipped) lines.push(`<div style="color:var(--teal);"><i class="fas fa-arrow-right-arrow-left"></i> Web search skipped (graph covered it)${t.coverage ? ' — coverage: ' + escHtml(t.coverage) : ''}</div>`);
  lines.push(`<div><b>Queries</b></div><ul style="margin:4px 0 0 18px;">${qs.flat().slice(0, 8).map(q => `<li>${escHtml(q)}</li>`).join('')}</ul>`);
  lines.push(`<div style="margin-top:8px;"><b>Search hits (${hits.length})</b></div>`);
  lines.push(`<table style="border-collapse:collapse;width:100%;margin:4px 0;">${hits.map(h => `<tr style="border-bottom:1px solid var(--border);"><td style="padding:3px 6px;color:var(--text2);">${h.rank != null ? '#' + h.rank : ''}</td><td style="padding:3px 6px;"><a href="${escHtml(h.url)}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;">${escHtml(h.title || h.url)}</a></td><td style="padding:3px 6px;color:var(--text2);">${escHtml(h.domain || '')}</td></tr>`).join('')}</table>`);
  lines.push(`<div style="margin-top:8px;"><b>Pages read (${fetched.filter(f => f.kept).length}/${fetched.length})</b></div>`);
  lines.push(`<ul style="margin:4px 0 0 18px;">${fetched.map(f => `<li><span style="color:${f.kept ? 'var(--green)' : 'var(--red)'};">${f.kept ? '✔' : '✖'}</span> <a href="${escHtml(f.url)}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;">${escHtml(f.title || f.url)}</a> <span style="color:var(--text2);">${f.kept ? f.chars + ' chars · ' + f.images + ' imgs' : escHtml(f.reason)}</span></li>`).join('')}</ul>`);
  if (t.gaps && t.gaps.length) lines.push(`<div style="margin-top:8px;"><b>Knowledge gaps</b>: ${t.gaps.map(escHtml).join(', ')}</div>`);
  if (Object.keys(timings).length) lines.push(`<div style="margin-top:8px;color:var(--text2);">Timings: ${Object.entries(timings).map(([k, v]) => `${k}=${v}ms`).join(' · ')}</div>`);
  if (t.hops > 0) lines.push(`<div style="color:var(--text2);">Hops: ${t.hops}</div>`);
  lines.push('</div>');
  return lines.join('');
}

function renderTrace(exp) {
  const box = document.getElementById('traceBox');
  if (!box) return;
  box.innerHTML = exp.trace ? traceHtml(exp) :
    '<div style="font-size:11px;color:var(--text2);margin:10px 0;">No research trace available for this explanation.</div>';
}

async function loadExplanations() {
  if (!currentInv) return;
  const bkmk = document.getElementById('bkmkOnly');
  const qs = bkmk && bkmk.checked ? '?bookmarked=true' : '';
  const res = await fetch(`${API}/investigations/${currentInv}/explanations${qs}`);
  const data = await res.json();
  const items = data.items || [];
  const dls = document.getElementById('explRecall');
  dls.innerHTML = items.map(e => `<option value="${escHtml(e.question).replace(/"/g, '&quot;')}"></option>`).join('');
  const hist = document.getElementById('explHistory');
  hist.innerHTML = items.map(e => `
    <div class="hist-row" style="cursor:default;">
      <button class="star-btn ${e.bookmarked ? 'on' : ''}" title="${e.bookmarked ? 'Remove bookmark' : 'Bookmark'}" onclick="event.stopPropagation();setBookmark(${e.id}, ${e.bookmarked ? 'false' : 'true'}, this)"><i class="fas ${e.bookmarked ? 'fa-star' : 'fa-star'}" style="${e.bookmarked ? 'color:var(--orange);' : 'color:var(--text2);'}"></i></button>
      <span style="flex:1;cursor:pointer;" onclick="openExplanation(${e.id})">
        <i class="fas ${e.status === 'done' ? 'fa-circle-check' : e.status === 'running' ? 'fa-spinner spin' : 'fa-circle-exclamation'}" style="color:${e.status === 'done' ? 'var(--green)' : e.status === 'running' ? 'var(--accent)' : 'var(--red)'};"></i>
        <span class="q">${escHtml(e.question)}</span>
      </span>
      <span style="font-size:10px;color:var(--text2);">${e.created_at ? new Date(e.created_at).toLocaleString() : ''}</span>
    </div>`).join('') || '<div class="empty-state"><i class="fas fa-lightbulb"></i><br/>No explanations yet — ask above.</div>';
}

async function setBookmark(expId, now, btn) {
  await fetch(`${API}/explanations/${expId}/bookmark`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ bookmarked: now }),
  });
  showNotif(now ? 'Bookmarked' : 'Bookmark removed', 'success');
  loadExplanations();
}

async function openExplanation(id) {
  switchView('explainer');
  const res = await fetch(`${API}/explanations/${id}`);
  const exp = await res.json();
  if (exp.status === 'running') watchExplanation(id);
  else renderExplanation(exp);
}

async function deleteExplanation(id) {
  if (!confirm('Delete this explanation?')) return;
  await fetch(`${API}/explanations/${id}`, { method: 'DELETE' });
  document.getElementById('articleBox').innerHTML = '';
  loadExplanations();
}

async function saveExplanationToGraph(expId) {
  const r = await fetch(`${API}/explanations/${expId}/save_to_graph`, { method: 'POST' });
  if (!r.ok) {
    let msg = 'Save failed';
    try { msg = (await r.json()).detail || msg; } catch (e) {}
    showNotif(msg, 'error');
    return;
  }
  const d = await r.json();
  showNotif(`Saved: ${d.created_artifacts} artifacts, ${d.created_relationships} relationships`, 'success');
  loadGraph(); loadArtifacts(); updatePendingCount();
}

/* ---------- follow-ups / threads / gaps ---------- */
let fuScope = null, fuIdx = null;

function fuScopeLabel() {
  if (fuScope === 'section' && fuIdx != null) return `scope: section #${fuIdx}`;
  return 'whole explanation';
}

function refreshFuPlaceholder(input) {
  if (input) input.placeholder = 'Ask a follow-up (' + fuScopeLabel() + ')…';
}

function setFuScope(expId, idx) {
  fuScope = 'section'; fuIdx = idx;
  const inp = document.getElementById('fuInput');
  if (inp) { inp.focus(); refreshFuPlaceholder(inp); }
}

async function submitFollowup(expId) {
  const inp = document.getElementById('fuInput');
  const q = (inp && inp.value.trim());
  if (!q) return;
  const body = fuScope && fuIdx != null
    ? { question: q, scope: 'section', target_index: fuIdx }
    : { question: q, scope: 'whole' };
  fuScope = null; fuIdx = null;
  const res = await fetch(`${API}/explanations/${expId}/followup`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  if (!res.ok) { let m = 'Follow-up failed'; try { m = (await res.json()).detail || m; } catch (e) {} showNotif(m, 'error'); return; }
  const child = await res.json();
  if (child.status === 'running') watchExplanation(child.id);
  refreshThread(expId);
}

async function renderThread(exp) {
  const box = document.getElementById('threadBox');
  if (!box) return;
  box.innerHTML = '';
  let data = null;
  try {
    const res = await fetch(`${API}/explanations/${exp.id}/thread`);
    data = await res.json();
  } catch (e) { return; }
  const items = (data.items || []).filter(i => i.id !== exp.id);
  if (!items.length) return;
  let html = `<h4 style="font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text2);margin:16px 0 8px;"><i class="fas fa-reply-all"></i> Follow-ups (${items.length})</h4>`;
  items.forEach(c => {
    html += `<div class="fu-card">
      <div style="display:flex;gap:8px;align-items:center;">
        <span style="font-size:11px;color:var(--accent);"><i class="fas fa-reply"></i></span>
        <div style="flex:1;"><b style="font-size:12px;">${escHtml(c.question)}</b></div>
        <span class="mode-pill">${escHtml(c.status)}</span>
      </div>
      <div id="fu-body-${c.id}"></div>
      <button class="btn btn-ghost btn-sm" onclick="loadFuArticle(${c.id})"><i class="fas fa-angle-down"></i> Expand</button>
    </div>`;
  });
  box.innerHTML = html;
}

async function refreshThread(expId) {
  if (!activeArticle) return;
  const res = await fetch(`${API}/explanations/${expId}`);
  const exp = await res.json();
  renderThread(exp);
}

async function loadFuArticle(expId) {
  const el = document.getElementById(`fu-body-${expId}`);
  if (!el) return;
  const res = await fetch(`${API}/explanations/${expId}`);
  const exp = await res.json();
  if (exp.status !== 'done' || !exp.answer) {
    el.innerHTML = `<div style="font-size:11px;color:var(--text2);">${exp.status === 'running' ? 'Researching follow-up…' : 'Failed follow-up.'}</div>`;
    return;
  }
  activeArticle = exp;
  const a = exp.answer;
  let html = `<div class="article fu-article">`;
  if (a.summary) html += `<p style="color:var(--text2);font-style:italic;font-size:12px;">${mdInline(a.summary)}</p>`;
  (a.sections || []).forEach((s, si) => {
    html += `<h3 style="font-size:13px;">${escHtml(s.heading || '')}</h3>${mdBlock(s.body || '')}`;
    if (s.claims && s.claims.length) {
      html += `<div class="claims-list">` + s.claims.map((c, ci) => {
        cacheEv(`${expId}-ev-${si}-${ci}`, c, a);
        return `<div class="claim-row"><div class="claim-text">${mdInline(c.text)}</div><div class="claim-cits">
          ${(c.citations || []).map((cit, ki) => `<button class="ev-btn" onclick="toggleEvidence('${si}', ${ci}, '${expId}-')">[${cit.sourceIndex + 1}]</button>`).join('')}
          <a class="ev-q no-und" href="javascript:void(0)" onclick="toggleEvidence('${si}', ${ci}, '${expId}-')">Show evidence</a></div>
        <div class="ev-drawer" id="${expId}-ev-${si}-${ci}" style="display:none;"></div></div>`;
      }).join('') + `</div>`;
    }
  });
  if (a.key_points && a.key_points.length) {
    html += `<div class="kp-box"><strong>Key points</strong><ul style="margin:6px 0 0 18px;">${a.key_points.map(k => `<li>${mdInline(k)}</li>`).join('')}</ul></div>`;
  }
  if (a.sources && a.sources.length) {
    html += `<h4 style="font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text2);margin:10px 0 6px;">Sources</h4>${a.sources.map((s, i) => `<div class="src-row">[${i + 1}] ${srcLink(s)}</div>`).join('')}`;
  }
  html += `</div>`;
  el.innerHTML = html;
}

async function investigateGaps(expId) {
  const res = await fetch(`${API}/explanations/${expId}/investigate_gaps`, { method: 'POST' });
  if (!res.ok) {
    let m = 'No open gaps to investigate';
    try { m = (await res.json()).detail || m; } catch (e) {}
    showNotif(m, 'info');
    return;
  }
  const d = await res.json();
  showNotif(`Agent run #${d.run_id} launched to investigate gaps`, 'success');
  loadInvestigations(); loadTimeline();
}

/* ---------- suggestions / quiz / bookmarks (#9, #10) ---------- */

async function renderSuggestions(exp) {
  const strip = document.getElementById('suggStrip');
  if (!strip || exp.status !== 'done') return;
  let data = null;
  try {
    const res = await fetch(`${API}/explanations/${exp.id}/suggestions`);
    data = await res.json();
  } catch (e) { return; }
  const items = (data.items || []).filter(it => it.text);
  if (!items.length) return;
  strip.style.display = 'flex';
  strip.innerHTML =
    `<span style="font-size:11px;color:var(--text2);align-self:center;">Next questions:</span>` +
    items.map(it => `<button class="sugg-chip kind-${escHtml(it.kind)}" title="${escHtml(it.kind)}"
      onclick="useSuggestion(this.textContent.trim())">${escHtml(it.text)}</button>`).join('');
}

function useSuggestion(text) {
  document.getElementById('fuInput').value = text;
  document.getElementById('fuInput').focus();
}

async function makeQuiz(expId) {
  const res = await fetch(`${API}/explanations/${expId}/quiz`, { method: 'POST' });
  if (!res.ok) {
    let m = 'Quiz generation failed';
    try { m = (await res.json()).detail || m; } catch (e) {}
    showNotif(m, 'error');
    return;
  }
  showNotif('Quiz ready', 'success');
  const d = await res.json();
  const expRes = await fetch(`${API}/explanations/${expId}`);
  renderExplanation(await expRes.json());
}

function renderQuiz(exp) {
  if (!exp.quiz || !exp.quiz.items || !exp.quiz.items.length) return;
  const qz = exp.quiz;
  let score = 0;
  const html = `<div class="quiz-box">
    <h4 style="font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text2);margin:16px 0 4px;"><i class="fas fa-clipboard-question"></i> Review quiz · <span class="quiz-score" id="quizScore">0 / ${qz.items.length}</span><span class="quiz-reset" onclick="resetQuiz('${exp.id}')">Retry</span></h4>
    ${qz.items.map((it, qi) => `
      <div class="quiz-q">
        <div class="qnum">Q${qi + 1}</div>
        <div style="font-weight:600;margin:2px 0 6px;">${escHtml(it.question)}</div>
        ${it.options.map((o, oi) => `
          <div class="quiz-opt" id="qo-${exp.id}-${qi}-${oi}" onclick="pickOpt(${exp.id}, ${qi}, ${oi}, ${it.correct_index})">
            <span>${String.fromCharCode(65 + oi)}.</span><span>${escHtml(o)}</span>
          </div>`).join('')}
        <div class="quiz-rationale" id="qr-${exp.id}-${qi}"><i class="fas fa-lightbulb" style="color:var(--orange);"></i> ${escHtml(it.rationale)}</div>
      </div>`).join('')}
  </div>`;
  const box = document.getElementById('threadBox');
  box.insertAdjacentHTML('afterend', html);
}

const quizState = {};

function pickOpt(expId, qi, oi, correct) {
  if (quizState[expId] && quizState[expId][qi] != null) return;
  quizState[expId] = quizState[expId] || {};
  const q = document.querySelectorAll(`[id^="qo-${expId}-${qi}-"]`);
  q.forEach(el => {
    el.classList.add('picked');
    el.style.pointerEvents = 'none';
  });
  const chosen = document.getElementById(`qo-${expId}-${qi}-${oi}`);
  const right = document.getElementById(`qo-${expId}-${qi}-${correct}`);
  if (oi === correct) {
    chosen.classList.add('correct');
    quizState[expId][qi] = true;
  } else {
    chosen.classList.add('wrong');
    right.classList.add('correct');
    quizState[expId][qi] = false;
  }
  document.getElementById(`qr-${expId}-${qi}`).style.display = 'block';
  const keys = Object.keys(quizState[expId]);
  const score = keys.filter(k => quizState[expId][k]).length;
  const el = document.getElementById('quizScore');
  if (el) el.textContent = `${score} / ${keys.length}`;
}

function resetQuiz(expId) {
  delete quizState[expId];
  document.querySelectorAll(`[id^="qo-${expId}-"]`).forEach(el => {
    el.classList.remove('correct', 'wrong', 'picked');
    el.style.removeProperty('pointer-events');
  });
  document.querySelectorAll(`[id^="qr-${expId}-"]`).forEach(el => el.style.display = 'none');
  const total = document.querySelectorAll('.quiz-q').length;
  const el = document.getElementById('quizScore');
  if (el) el.textContent = `0 / ${total}`;
}

async function toggleBookmark(expId, btn) {
  const exp = activeArticle;
  const now = exp.bookmarked ? false : true;
  try {
    await fetch(`${API}/explanations/${expId}/bookmark`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bookmarked: now }),
    });
    exp.bookmarked = now;
    btn.classList.toggle('bkmk-on', now);
    showNotif(now ? 'Bookmarked' : 'Bookmark removed', 'success');
    loadExplanationsMarked();
  } catch (e) { showNotif('Bookmark failed', 'error'); }
}

function loadExplanationsMarked() {
  loadExplanations();
}

/* ---------- scheduler ---------- */
function onSchedPreset() {
  const v = document.getElementById('schedPreset').value;
  if (v !== 'custom') document.getElementById('schedCron').value = v;
}

async function saveSchedule() {
  if (!currentInv) return;
  const res = await fetch(`${API}/investigations/${currentInv}/schedule`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      enabled: document.getElementById('schedEnabled').checked,
      cron: document.getElementById('schedCron').value.trim() || '0 4 * * *',
      max_items: parseInt(document.getElementById('schedItems').value) || 25,
      max_rounds: parseInt(document.getElementById('schedRounds').value) || 2,
    }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    showNotif(err.detail || 'Invalid schedule', 'error');
    return;
  }
  showNotif('Schedule saved', 'success');
  selectInvestigation(currentInv);
}

function fillSchedule(sched) {
  const s = sched || {};
  document.getElementById('schedEnabled').checked = !!s.enabled;
  document.getElementById('schedCron').value = s.cron || '0 4 * * *';
  document.getElementById('schedItems').value = s.max_items || 25;
  document.getElementById('schedRounds').value = s.max_rounds || 2;
  const presets = [...document.getElementById('schedPreset').options].map(o => o.value);
  document.getElementById('schedPreset').value = presets.includes(s.cron) ? s.cron : 'custom';
  document.getElementById('schedNext').textContent = s.enabled && s.next_run_at
    ? `Next run: ${new Date(s.next_run_at).toLocaleString()}`
    : s.enabled ? 'Enabled — next run computes shortly' : 'Scheduling off';
}

function onSearch() { if (currentInv) loadArtifacts(); }

function switchView(view) {
  document.querySelectorAll('.main-tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('visible'));
  document.getElementById(view + 'View').classList.add('visible');
  if (view === 'graph' && network) setTimeout(() => network.fit({ animation: true }), 100);
}

loadExplDefaults();

window.addEventListener('resize', () => { if (network) network.fit({ animation: false }); });
